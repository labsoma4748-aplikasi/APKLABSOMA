name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Capacitor CLI & Android
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Prepare Dummy Web Directory
        run: |
          mkdir -p www
          echo '<!DOCTYPE html><html><head><title>App</title></head><body></body></html>' > www/index.html

      - name: Add Android Platform & Sync
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Fix Kotlin Duplicate Class Conflict
        run: |
          cat << 'EOF' >> android/build.gradle
          subprojects {
              configurations.all {
                  resolutionStrategy.eachDependency { DependencyResolveDetails details ->
                      if (details.requested.group == 'org.jetbrains.kotlin') {
                          details.useVersion '1.9.22'
                      }
                  }
              }
          }
          EOF

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: APKLABSOMA-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
